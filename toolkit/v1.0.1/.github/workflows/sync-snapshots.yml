name: Synchronise les instantanés de la visionneuse

# Filet de sécurité côté serveur : si quelqu'un modifie README.md, LICENSE,
# le code du convertisseur ou les fichiers clavier sans avoir activé le
# hook .githooks/pre-commit localement (par exemple via l'éditeur web de
# GitHub), ce workflow remet automatiquement à jour l'instantané intégré
# dans web-demo/index.html et pousse un commit correctif.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "LICENSE"
      - "converter/**"
      - "keyboard/**"
      - "web-demo/index.html"
      - "scripts/sync_snapshots.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifie s'il y a une dérive
        id: check
        run: |
          if python3 scripts/sync_snapshots.py --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Corrige la dérive et commite
        if: steps.check.outputs.drift == 'true'
        run: |
          python3 scripts/sync_snapshots.py
          git config user.name "aac-toolkit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web-demo/index.html
          git commit -m "chore: synchronise les instantanés de la visionneuse [skip ci]"
          git push
