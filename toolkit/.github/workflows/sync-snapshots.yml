name: Régénère web-demo/generated

# Filet de sécurité côté serveur : si quelqu'un modifie README.md, LICENSE,
# les règles, le corpus, le code du convertisseur ou les fichiers clavier
# sans avoir activé le hook .githooks/pre-commit localement (par exemple via
# l'éditeur web de GitHub), ce workflow relance scripts/build.py et pousse un
# commit correctif de web-demo/generated/.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "LICENSE"
      - "converter/**"
      - "keyboard/**"
      - "docs/letter-frequency-analysis.md"
      - "scripts/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifie s'il y a une dérive
        id: check
        run: |
          if python3 scripts/build.py --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Corrige la dérive et commite
        if: steps.check.outputs.drift == 'true'
        run: |
          python3 scripts/build.py
          git config user.name "aac-toolkit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web-demo/generated
          git commit -m "chore: régénère web-demo/generated [skip ci]"
          git push
