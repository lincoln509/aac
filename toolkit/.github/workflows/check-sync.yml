name: Vérifie les fichiers générés et les tests

# Complète sync-snapshots.yml. Ici on ne corrige PAS automatiquement : on
# fait échouer le build si web-demo/generated/ est périmé par rapport à ses
# sources (rules.json, corpus.py, README...), si le JavaScript d'une page ne
# compile plus, ou si les tests Python / Node échouent (dont la parité
# Python <-> JS sur tout le corpus).
# Correctif local : `python3 scripts/build.py` (ou activer le hook
# .githooks/pre-commit, qui le lance à chaque commit).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fichiers générés à jour (scripts/build.py --check)
        run: python3 scripts/build.py --check

      - name: Dépendances des tests
        run: pip install pytest numpy scipy python-docx reportlab pdfplumber

      - name: Tests (Python, parité Node, syntaxe JS des pages)
        run: python3 -m pytest converter/tests -q
